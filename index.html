<!DOCTYPE html>
<!-- saved from url=(0037)https://toniwan.github.io/prototype5/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唔方便戀愛</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="shortcut icon" type="image/x-icon" href="./img/logo.svg" />
</head>
<body>

  <!-- Banner with Title -->
  <div class="banner">
    <img src="./img/header.svg" alt="Banner Image">
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="button-grid">
      <div class="sound-button" onclick="playSound('./mp3/sound1.mp3')">
        <img src="./img/button1.png" alt="Option A">
      </div>
      <div class="sound-button" onclick="playSound('./mp3/sound2.mp3')">
        <img src="./img/button2.png" alt="Option B">
      </div>
      <div class="sound-button" onclick="playSound('./mp3/sound3.mp3')">
        <img src="./img/button3.png" alt="Option C">
      </div>
      <div class="sound-button" onclick="playSound('./mp3/sound4.mp3')">
        <img src="./img/button4.png" alt="Option D">
      </div>
    </div>
  </div>

  <!-- Footer Logo -->
  <footer>
    <img src="./img/logo.svg" alt="Logo">
  </footer>

  <!-- Audio Playback Script -->
  <script>
    function playSound(src) {
      const audio = new Audio(src);
      audio.play();
    }
</script>



</body></html>
